[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyayalay"
version = "0.1.0"
description = "Domain-routed, retrieval-grounded Indian legal information assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0",
    "openai>=1.50",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "beautifulsoup4>=4.12", "requests>=2.32", "pypdf>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
